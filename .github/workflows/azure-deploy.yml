name: Build and deploy Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    env:
      RESOURCE_GROUP: soil-agri-rg
      FUNCTION_APP: soil-agri-functions-617db570
      WEB_APP: soil-agri-dashboard-617db570
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            azure-functions/package-lock.json
            blockchain/package-lock.json
            smart-agri-dashboard/package-lock.json
      - name: Verify Functions
        working-directory: azure-functions
        run: npm ci && npm test && npm run build
      - name: Verify contract
        working-directory: blockchain
        run: npm ci && npm test && npm run compile
      - name: Build dashboard
        working-directory: smart-agri-dashboard
        run: npm ci && npm run build
      - uses: azure/login@v2
        with:
          # These are resource identifiers, not credentials. Authentication uses
          # the short-lived GitHub OIDC token and the Azure federated credential.
          client-id: 14106b56-3375-4994-a810-e67112023f30
          tenant-id: 16b09027-c852-4980-9d01-bd9ffc9b1276
          subscription-id: 617db570-27f6-43a2-8d98-7b067bc2336b
      - name: Package Functions
        working-directory: azure-functions
        run: npm ci --omit=dev && zip -qr ../functions.zip dist host.json node_modules package-lock.json package.json
      - name: Deploy Functions
        run: az functionapp deployment source config-zip -g "$RESOURCE_GROUP" -n "$FUNCTION_APP" --src functions.zip --build-remote false
      - name: Package dashboard
        run: |
          mkdir -p dashboard/.next
          cp -R smart-agri-dashboard/.next/standalone/. dashboard/
          cp -R smart-agri-dashboard/.next/static dashboard/.next/static
          (cd dashboard && zip -qr ../dashboard.zip .)
      - name: Deploy dashboard
        run: az webapp deploy -g "$RESOURCE_GROUP" -n "$WEB_APP" --src-path dashboard.zip --type zip --clean true --restart true
